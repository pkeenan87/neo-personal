[package]
name = "neo-agent"
description = "Neo Protection: the Windows service and macOS daemon of the Neo desktop agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["http"]
# Real HTTP. Off only for compile-checking the Windows code without a C toolchain.
http = ["dep:ureq", "neo-agent-core/http"]

[lib]
name = "neo_agent"

[[bin]]
name = "neo-agent"
path = "src/main.rs"
required-features = ["http"]

[dependencies]
base64.workspace = true
log = { workspace = true, features = ["std"] }
minisign-verify.workspace = true
neo-agent-core = { path = "../agent-core", default-features = false }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["macros"] }
ureq = { workspace = true, optional = true }

# macOS code that is plain files, SQLite and plists also builds (and is tested) on Linux, so these
# are `cfg(unix)`; Windows never compiles them.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
plist = { version = "=1.10.1", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

# Only the Security framework glue needs a Mac.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
security-framework-sys = "=2.17.0"

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows-registry = "=0.6.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
