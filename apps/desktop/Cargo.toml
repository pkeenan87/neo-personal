# Cargo workspace for the Neo desktop agent (spec `_specs/desktop-agent.md`).
# Not a turbo task: run `cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test` here.
[workspace]
resolver = "3"
members = ["crates/agent-core", "crates/agent-service", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.90"

# Exact pins; member crates inherit with `dep.workspace = true`.
[workspace.dependencies]
base64 = "=0.23.1"
log = "=0.4.34"
minisign-verify = "=0.3.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
tempfile = "=3.27.0"
uuid = { version = "=1.26.1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
