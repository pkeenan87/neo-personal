# Re-register the Inngest app after every successful production deployment.
# Inngest only runs functions of a synced app, and the Vercel integration's
# automatic sync has proven unreliable (docs/deployment.md, "Inngest sync after
# deploys"). The serve route registers itself with Inngest Cloud on a PUT using
# the INNGEST_SIGNING_KEY already in the Vercel environment, so no secret is
# needed here. Uses no third-party actions.
name: Inngest sync

on:
  deployment_status:

permissions: {}

jobs:
  sync:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register the app with Inngest Cloud
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 -X PUT -H 'Content-Type: application/json' \
              -w '\n%{http_code}' https://www.neoshield.dev/api/inngest || true)
            code=${body##*$'\n'}
            echo "attempt $attempt: HTTP $code: ${body%$'\n'*}"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Inngest sync failed" >&2
          exit 1
