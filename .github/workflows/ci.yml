name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to no token scopes; each job opts into exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # CI never has real credentials. Every external API runs in mock mode
      # and nothing may require a secret to build or test (see CLAUDE.md).
      MOCK_MODE: "true"
      DEV_AUTH_BYPASS: "false"
      AUTH_SECRET: ci-only-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test, build
        run: pnpm turbo run typecheck lint test build

  codeql:
    name: CodeQL (security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still leaked
          persist-credentials: false
      # Official gitleaks image, pinned by digest (tag kept for readability).
      # Running the CLI directly instead of gitleaks-action avoids that action's
      # license requirement for organization-owned repos and keeps CI identical
      # to the local pre-commit hook (same binary, same .gitleaks.toml).
      # Blocking: a finding exits 1, fails this job, and fails all-checks-passed.
      - name: Scan full history
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --verbose \
              --no-banner \
              --exit-code 1

  # Single required status check for branch protection. Runs even when an
  # upstream job fails or is cancelled, and fails unless every job succeeded.
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [checks, codeql, gitleaks]
    if: always()
    permissions: {}
    steps:
      - name: Verify upstream job results
        env:
          CHECKS: ${{ needs.checks.result }}
          CODEQL: ${{ needs.codeql.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
        run: |
          echo "checks:   $CHECKS"
          echo "codeql:   $CODEQL"
          echo "gitleaks: $GITLEAKS"
          failed=0
          for pair in "checks=$CHECKS" "codeql=$CODEQL" "gitleaks=$GITLEAKS"; do
            if [[ "${pair#*=}" != "success" ]]; then
              echo "::error::${pair%%=*} did not pass (${pair#*=})"
              failed=1
            fi
          done
          exit "$failed"
