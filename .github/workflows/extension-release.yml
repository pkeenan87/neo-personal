name: Extension release

# Builds the browser extension for a tagged release and attaches the store-upload zips (Chrome,
# Firefox, and the Firefox/AMO source archive) to a GitHub release. Store submission itself stays
# manual (docs/extension.md "Release steps"): this workflow only produces the files to upload.
on:
  push:
    tags:
      - "extension-v*"

# Default to no token scopes; the job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Build, zip and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the extension and its workspace dependencies
        run: pnpm turbo run build --filter=@neo/extension...

      - name: Zip the Chrome, Firefox and source packages
        run: pnpm --filter @neo/extension zip

      - name: Publish the GitHub release with the built zips attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            apps/extension/.output/neo-extension-*-chrome.zip \
            apps/extension/.output/neo-extension-*-firefox.zip \
            apps/extension/.output/neo-extension-*-sources.zip
