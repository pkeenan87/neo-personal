version: 2
updates:
  # pnpm workspace: Dependabot reads the root pnpm-lock.yaml and updates every
  # workspace package from the root directory.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️ deps"
    groups:
      # One PR per week for all non-breaking bumps.
      minor-and-patch:
        update-types: [minor, patch]
      # React and its types must move together or install fails on peer deps.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major]
    ignore:
      # The chat loop still imports this SDK and is removed at M3. Major bumps
      # (for example 0.x → 1.x) stay closed until that deletion; minor and patch
      # updates still open in the minor-and-patch group.
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ ci"
    groups:
      actions:
        patterns: ["*"]
